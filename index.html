<style>
:root{--bg:#f2f2f1;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#d99a0b;--border:#d9d9d4;--yellow:#f0b92b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--text:#f1f1ee;--muted:#9a9a94;--accent:#f0b92b;--border:#3a3a38}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--text:#f1f1ee;--muted:#9a9a94;--accent:#f0b92b;--border:#3a3a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0}
.bar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
#tools{flex:1;min-width:0;display:flex;align-items:center;gap:10px;margin:0 16px}
#tools>*{flex:none}
#tmid{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
#tmid>*{flex:none}
#tmid::-webkit-scrollbar{display:none}
.sep{width:1px;height:26px;background:var(--border);flex:none}
.right{display:flex;align-items:center;gap:20px;flex:none}
button#newbtn{border:2px solid var(--yellow);font-weight:800;padding:6px 16px;font-size:.78rem}
button#newbtn:hover{background:var(--yellow);color:#1d1d1b}
.addt{border:2px dashed var(--border)!important;background:transparent!important;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;align-self:start;text-align:center;padding:0!important;border-radius:10px;user-select:none}
.addt:hover,.addt.over,.addt:focus-visible{border-color:var(--accent)!important;color:var(--accent);outline:0}
.addt .plus{font-size:2.6rem;font-weight:500;line-height:1}
.addt small{font-size:.72rem;letter-spacing:.02em}
.sth.addt{border-radius:6px}
.sth.addt .plus{font-size:1.6rem}
.sth.addt small{font-size:.58rem}
#tools .btn,#tools select{padding:7px 13px;font-size:.78rem}
#tools .go{min-width:0;flex:none;padding:8px 16px;font-size:.8rem}
#split,#wordp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 0}
#wordp select{font-size:.8rem;padding:8px 14px}
#split input,#wordp input{font:inherit;font-size:.85rem;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);flex:1;min-width:180px;max-width:320px}
#split .go,#wordp .go{padding:9px 16px;font-size:.8rem;min-width:0;flex:none}
#smsg,#wmsg{font-size:.8rem;color:var(--muted)}
.lp{position:relative}
.lp::before{content:"";position:absolute;left:calc(50% - .45em);top:50%;width:0;height:0;border-radius:50%;background:var(--yellow);transform:translate(-50%,-50%);z-index:-1}
body.has .lp{color:#1d1d1b}
body.has .lp::before{width:1.7em;height:1.7em}
@media (max-width:720px){body.has nav{display:none}}
.logo{font-weight:800;font-size:1.2rem;color:var(--text);text-decoration:none;position:relative;z-index:0;margin-left:1em}
nav{display:flex;gap:26px}
nav a{color:var(--text);text-decoration:none;font-size:.8rem;letter-spacing:.04em;font-weight:500}
nav a:hover,nav a.on{color:var(--accent)}
#hero{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 140px);padding:10px 0 30px}
#drop{width:min(80vw,430px);aspect-ratio:1;border-radius:50%;background:var(--yellow);color:#1d1d1b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:none;transition:background .15s}
#drop.over{background:#f5c64a}
.opt{font-weight:800;font-size:1.5rem;color:#1d1d1b;cursor:default;user-select:none}
#drop.pick{cursor:pointer}
#drop.pick:hover{background:#f5c64a}
.plus{font-size:5rem;font-weight:500;line-height:1;text-align:center}
.bigc>span{display:block}
#add small{display:block;text-align:center;font-size:.85rem;opacity:.75;margin-top:6px}

#big{margin:0 0 0 -75px;font-size:clamp(2.6rem,7vw,5.4rem);font-weight:800;line-height:.95;letter-spacing:-.02em;position:relative;pointer-events:none}
#big span{display:block}
#aboutv{max-width:560px;margin:70px auto;font-size:1.05rem;line-height:1.7}
#aboutv h2{font-size:2.4rem;margin:0 0 12px;font-weight:800}
#work{padding:10px 0 50px}
#list{list-style:none;padding:0;margin:16px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
li,.sth{transition:transform .15s,box-shadow .15s}
li.drag,.sth.drag{opacity:.85;border-color:var(--accent);transform:scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.3);position:relative;z-index:5}
.top,.bot{display:flex;align-items:center;justify-content:space-between}
.pg{color:var(--accent);font-weight:800;font-size:.9rem;padding-left:4px}
.grip{cursor:grab;touch-action:none;user-select:none;color:var(--muted);padding:4px 8px;font-size:1.1rem}
.box{height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);border-radius:6px}
.box img{max-width:100%;max-height:100%;transition:transform .15s;pointer-events:none}
.box .blank{width:84px;height:118px;background:#fff;border:1px solid var(--border)}
#list.doc{grid-template-columns:minmax(0,640px);justify-content:center;gap:22px}
#list.doc .box{height:auto;aspect-ratio:210/297;background:#fff;color:#555;box-shadow:0 2px 14px rgba(0,0,0,.2);border-radius:2px}
#list.doc .box img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.tag{font-size:.7rem;color:var(--muted);padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li button{background:none;border:0;color:var(--muted);font-size:1.25rem;cursor:pointer;padding:2px 8px}
li button:hover{color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button.btn{font:inherit;font-size:.85rem;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
button.go{font:inherit;font-weight:800;padding:12px 18px;border-radius:999px;background:var(--yellow);color:#1d1d1b;border:0;cursor:pointer;flex:1;min-width:160px}
button:disabled{opacity:.4;cursor:default}
#msg{color:var(--muted);font-size:.9rem;margin-top:10px}
@media (max-width:720px){#hero{flex-direction:column;min-height:0;padding-top:20px}#big{margin:22px 0 0;text-align:center}nav{gap:16px}}
#side{display:none}
#work.docmode{display:grid;grid-template-columns:156px minmax(0,1fr);gap:20px;align-items:start}
#work.docmode #msg{grid-column:1/-1}
#work.docmode #side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 96px);overflow-y:auto;margin:16px 0;padding:2px;scrollbar-width:thin;align-content:start}
.sth{position:relative;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:3px;cursor:pointer}
.sth.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stb{aspect-ratio:210/297;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px}
.stb img{max-width:100%;max-height:100%;pointer-events:none}
.sth .n{position:absolute;left:5px;bottom:4px;font-size:.62rem;font-weight:800;color:#1d1d1b;background:rgba(255,255,255,.85);border-radius:4px;padding:0 4px}
.sth .grip{position:absolute;right:0;top:0;padding:2px 6px;font-size:.85rem;background:rgba(255,255,255,.85);color:#555;border-radius:0 5px 0 5px}
#list.doc li{scroll-margin-top:80px}
.box{position:relative}
.wo{position:absolute;inset:0;pointer-events:none}
.wr{position:absolute;background:#fff}
body.wom .wr{outline:1.5px dashed var(--accent)}
.wr b{display:none;position:absolute;top:0;right:0;width:20px;height:20px;align-items:center;justify-content:center;background:var(--yellow);color:#1d1d1b;font-size:.9rem;line-height:1;cursor:pointer;pointer-events:auto}
body.wom .wr b{display:flex}
.wr.pv{background:rgba(255,255,255,.7)}
body.wom #list.doc .box{touch-action:none;cursor:crosshair;user-select:none}
.btn.on{background:var(--yellow)!important;color:#1d1d1b!important;border-color:var(--yellow)!important}
@media (max-width:720px){#work.docmode{grid-template-columns:104px minmax(0,1fr);gap:10px}.sth .grip{padding:1px 4px;font-size:.75rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar"><div class="brand"><a class="logo" href="#editor"><span class="lp">p</span>df-ep.</a></div>
    <div id="tools" hidden>
      <button class="go" id="go" disabled>Download PDF</button>
      <span class="sep"></span>
      <div id="tmid">
        <button class="btn" id="splitbtn">Custom split</button>
        <button class="btn" id="wordbtn">Word</button>
        <button class="btn" id="viewmode">Document view</button>
        <button class="btn" id="wobtn">Whiteout</button>
        <span class="sep" id="sep2" hidden></span>
        <select id="size" hidden><option value="fit">Paper: original (blank = A4)</option><option value="a4">Paper: A4</option><option value="letter">Paper: Letter 8.5 × 11 in</option><option value="long">Paper: Legal 8.5 × 13 in</option><option value="a3">Paper: A3</option><option value="a5">Paper: A5</option></select>
        <select id="place" hidden><option value="mc">Place: Center</option><option value="tl">Top left</option><option value="tc">Top center</option><option value="tr">Top right</option><option value="ml">Middle left</option><option value="mr">Middle right</option><option value="bl">Bottom left</option><option value="bc">Bottom center</option><option value="br">Bottom right</option></select>
      </div>
    </div>
    <div class="right"><button class="btn" id="newbtn" hidden>New</button><nav><a href="#about" data-v="about">ABOUT US</a></nav></div></div>
    <div id="wordp" hidden><select id="wmode"><option value="text">Editable text</option><option value="hybrid">Look-alike (keeps page layout)</option><option value="img">Pages as images</option></select><input id="wranges" placeholder="All pages, or 1-2, 5" autocomplete="off"><button class="go" id="wordgo">Download Word</button><span id="wmsg"></span></div>
    <div id="split" hidden><input id="ranges" placeholder="1-2, 3, 4, 5-6" autocomplete="off"><button class="go" id="splitgo">Download split PDFs</button><span id="smsg"></span></div>
  </header>
  <section id="hero">
    <div id="drop"><span class="opt">picture to pdf</span><span class="opt">merge pdf</span><span class="opt">delete pdf</span><div id="add" hidden><div class="plus">+</div><small>.pdf · .jpg · .jpeg · .jfif</small></div></div>
    <h2 id="big"><span id="b1">less fuss.</span><span id="b2">more pdf.</span><span id="b3" hidden></span></h2>
  </section>
  <section id="aboutv" hidden>
    
    
  </section>
  <input id="file" type="file" accept=".pdf,application/pdf,.jpg,.jpeg,.jfif,image/jpeg,image/pjpeg" multiple hidden>
  <section id="work" hidden>
    <aside id="side"></aside>
    <ul id="list"></ul>
    <div id="msg"></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// Save a file: Claude artifact 'downloads' capability if present, otherwise a normal browser download (GitHub Pages, local file, any host).
async function saveFile(filename,data){
  if(window.claude&&claude.use){
    try{const d=await claude.use('downloads');if(d){await d.save({filename,data});return}}catch(e){if(e&&e.code==='declined')throw e}
  }
  const url=URL.createObjectURL(data),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
const $=id=>document.getElementById(id);
const pages=[];
// signature of the current work, to know whether it was downloaded since the last change
const sig=()=>pages.map(p=>(p.name||'blank')+'|'+(p.idx??'')+'|'+(p.rot||0)+'|'+(p.url?p.url.length:'')+'|'+JSON.stringify(p.wo||[])).join('~');
let savedSig='';
const list=$('list'),go=$('go'),msg=$('msg'),file=$('file'),drop=$('drop');
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let mode='';

file.onchange=async()=>{const f=[...file.files];file.value='';if(mode==='delete'&&f.length)pages.length=0;await addFiles(f)};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=async e=>{e.preventDefault();drop.classList.remove('over');await addFiles([...e.dataTransfer.files])};
const pickFiles=()=>file.click();
const addBlank=()=>{pages.push({kind:'blank'});render()};
// paper size applies to every page; placement to PDF and JPEG pages
function syncOpts(){
  const any=pages.length>0,vis=pages.some(p=>p.kind!=='blank');
  $('size').hidden=!any;$('sep2').hidden=!any;$('place').hidden=!vis||$('size').value==='fit';
}
$('size').onchange=syncOpts;
function mkTile(tag,label,fn,drop){
  const t=document.createElement(tag);t.className=(tag==='li'?'':'sth ')+'addt';
  t.tabIndex=0;t.setAttribute('role','button');t.setAttribute('aria-label',label);
  t.innerHTML='<span class="plus">+</span><small></small>';t.querySelector('small').textContent=label;
  t.onclick=fn;t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}};
  if(drop){
    t.ondragover=e=>{e.preventDefault();t.classList.add('over')};
    t.ondragleave=()=>t.classList.remove('over');
    t.ondrop=async e=>{e.preventDefault();t.classList.remove('over');await addFiles([...e.dataTransfer.files])};
  }
  return t;
}

const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});

async function addFiles(files){
  // natural filename order within each batch (img2 before img10)
  files=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  for(const f of files){
    try{
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
        msg.textContent='Reading '+f.name+'…';
        const bytes=new Uint8Array(await f.arrayBuffer());
        const src={bytes,doc:await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true})};
        const n=src.doc.getPageCount();
        let pj=null;
        try{pj=await pdfjsLib.getDocument({data:bytes.slice()}).promise}catch(e){}
        src.pj=pj;
        for(let i=0;i<n;i++){
          let thumb=null;
          if(pj){try{thumb=await thumbOf(pj,i+1)}catch(e){}}
          pages.push({kind:'pdf',src,idx:i,rot:0,thumb,name:f.name});
          if(i%5===4)render();
        }
      }else if(/\.(jpe?g|jfif)$/i.test(f.name)||/jpe?g/i.test(f.type)){
        // JFIF files often arrive with a wrong MIME type, so force image/jpeg
        const url='data:image/jpeg;base64,'+(await readURL(f)).split(',')[1];
        const img=await loadImg(url);
        pages.push({kind:'img',url,w:img.naturalWidth,h:img.naturalHeight,name:f.name});
      }else msg.textContent='Skipped '+f.name+' (not a PDF or JPEG/JFIF).';
    }catch(e){msg.textContent='Could not read '+f.name+'.'}
    render();
  }
}

let bigQ=Promise.resolve();
async function bigOf(p){
  if(p.big&&p.bigRot===p.rot)return p.big;
  const pg=await p.src.pj.getPage(p.idx+1);
  const rotation=((pg.rotate||0)+p.rot)%360;
  const v=pg.getViewport({scale:1,rotation});
  const vp=pg.getViewport({scale:1000/v.width,rotation});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  p.ar=v.width/v.height;p.big=c.toDataURL('image/jpeg',.85);p.bigRot=p.rot;
  return p.big;
}
function setDoc(d){
  list.classList.toggle('doc',d);$('work').classList.toggle('docmode',d);
  $('viewmode').textContent=d?'Grid view':'Document view';
  if(!d){document.body.classList.remove('wom');$('wobtn').classList.remove('on')}
  render();
}
$('viewmode').onclick=()=>setDoc(!list.classList.contains('doc'));
const readyMsg=()=>pages.length?pages.length+' page'+(pages.length>1?'s':'')+' ready.':'';
$('wobtn').onclick=()=>{
  const on=!document.body.classList.contains('wom');
  if(on&&!list.classList.contains('doc'))setDoc(true);
  document.body.classList.toggle('wom',on);$('wobtn').classList.toggle('on',on);
  msg.textContent=on?'Whiteout on. Drag on a page to cover an area.':readyMsg();
};
// whiteout rectangles are stored per page as {x,y,w,h}, 0..1, relative to the page as displayed (after rotation)
function rotWO(p){if(p.wo)p.wo=p.wo.map(r=>({x:1-r.y-r.h,y:r.x,w:r.h,h:r.w}))}
function paintWO(ov,p){
  ov.innerHTML='';
  (p.wo||[]).forEach((r,i)=>{
    const d=document.createElement('div');d.className='wr';
    d.style.cssText='left:'+r.x*100+'%;top:'+r.y*100+'%;width:'+r.w*100+'%;height:'+r.h*100+'%';
    const b=document.createElement('b');b.textContent='×';b.title='Remove whiteout';
    b.onpointerdown=e=>e.stopPropagation();
    b.onclick=e=>{e.stopPropagation();p.wo.splice(i,1);paintWO(ov,p)};
    d.appendChild(b);ov.appendChild(d);
  });
}
function woDown(e,p,box,ov){
  if(!document.body.classList.contains('wom')||e.button>0)return;
  if(e.target.closest&&e.target.closest('.wr b'))return;
  e.preventDefault();
  const R=box.getBoundingClientRect(),cl=v=>Math.min(1,Math.max(0,v));
  const x0=cl((e.clientX-R.left)/R.width),y0=cl((e.clientY-R.top)/R.height);
  const pv=document.createElement('div');pv.className='wr pv';ov.appendChild(pv);
  let cur=null;
  try{box.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{
    const x=cl((ev.clientX-R.left)/R.width),y=cl((ev.clientY-R.top)/R.height);
    cur={x:Math.min(x,x0),y:Math.min(y,y0),w:Math.abs(x-x0),h:Math.abs(y-y0)};
    pv.style.cssText='left:'+cur.x*100+'%;top:'+cur.y*100+'%;width:'+cur.w*100+'%;height:'+cur.h*100+'%';
  };

        const emb=await out.embedPage(pg,{left:b.x,bottom:b.y,right:b.x+b.width,top:b.y+b.height});
        out.removePage(out.getPageCount()-1);

        const [fw,fh]=fmt,[pw,ph]=dw>dh?[fh,fw]:[fw,fh];
        const s=Math.min(pw/dw,ph/dh),w=dw*s,h=dh*s,uw=b.width*s,uh=b.height*s;
        const x0=pl[1]==='l'?0:pl[1]==='r'?pw-w:(pw-w)/2;
        const y0=pl[0]==='t'?ph-h:pl[0]==='b'?0:(ph-h)/2;
        const ox=R===180?uw:R===270?uh:0,oy=R===90?uw:R===180?uh:0;
        out.addPage([pw,ph]).drawPage(emb,{x:x0+ox,y:y0+oy,width:uw,height:uh,rotate:degrees(-R)});
      }

        const x=pl[1]==='l'?m:pl[1]==='r'?pw-m-w:(pw-w)/2;
        const yt=pl[0]==='t'?m:pl[0]==='b'?ph-m-h:(ph-h)/2;

      }
    }
  }

}

function parseRanges(txt,n){
  const out=[];
  for(const t of txt.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)){
    const m=t.match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
    if(!m)return 'Can’t read “'+t+'”. Try 1-2, 3.';
    const a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b>n||a>b)return '“'+t+'” is outside pages 1–'+n+'.';
    out.push({idx:Array.from({length:b-a+1},(_,i)=>a-1+i),label:a===b?''+a:a+'-'+b});
  }
  return out.length?out:'Enter ranges like 1-2, 3, 4, 5-6.';
}

    const join=cur&&prev&&!cur.head&&!head&&!cur.tab&&!tab&&!bullet.test(l.text)
      &&(l.y-prev.y)<Math.max(l.fs,prev.fs)*1.6&&Math.abs(l.fs-prev.fs)<1.5&&!(l.x0>prev.x0+l.fs*1.5);
    const joinHead=cur&&prev&&cur.head&&head&&Math.abs(l.fs-prev.fs)<1&&(l.y-prev.y)<l.fs*1.6;
    if(join||joinHead){
      cur.text=/-$/.test(cur.text)&&/^[a-z]/.test(l.text)?cur.text.slice(0,-1)+l.text:cur.text+' '+l.text;
      cur.n++;cur.x0=Math.min(cur.x0,l.x0);cur.xe=Math.max(cur.xe,l.xe);
    }else{
      cur={text:l.text,half:wClamp(Math.round(l.fs*2),12,144),head,tab,n:1,x0:l.x0,xe:l.xe};
      paras.push(cur);
    }
    prev=l;
  }
  paras.forEach(p=>{p.center=p.n===1&&p.x0>W*.12&&Math.abs((p.x0+p.xe)/2-W/2)<W*.04});
  const minX=Math.min(...lines.map(l=>l.x0)),maxX=Math.max(...lines.map(l=>l.xe));
  const top=lines[0].y-lines[0].fs,bot=lines[lines.length-1].y;
  return {paras,m:{l:wClamp(minX,36,W*.3),r:wClamp(W-maxX,36,W*.3),t:wClamp(top,36,100),b:wClamp(H-bot,36,100)}};
}

function wSect(W,H,m){
  return '<w:sectPr><w:pgSz w:w="'+wTw(W)+'" w:h="'+wTw(H)+'"'+(W>H?' w:orient="landscape"':'')+'/><w:pgMar w:top="'+wTw(m.t)+'" w:right="'+wTw(m.r)+'" w:bottom="'+wTw(m.b)+'" w:left="'+wTw(m.l)+'" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>';
}
function wPara(p,sect){
  const h=p.half;
  const runs=String(p.text).split('\t').map(t=>'<w:t xml:space="preserve">'+wEsc(t)+'</w:t>').join('<w:tab/>');
  return '<w:p><w:pPr><w:spacing w:before="0" w:after="'+(p.head?160:120)+'" w:line="259" w:lineRule="auto"/>'+(p.center?'<w:jc w:val="center"/>':'')+(sect||'')+'</w:pPr><w:r><w:rPr>'+(p.head?'<w:b/>':'')+'<w:sz w:val="'+h+'"/><w:szCs w:val="'+h+'"/></w:rPr>'+runs+'</w:r></w:p>';
}
function wImg(rid,id,W,H,sect){
  const cx=Math.round(W*12700),cy=Math.round(H*12700);
  return '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/>'+(sect||'')+'</w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="'+id+'" name="Page '+id+'"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="'+id+'" name="page'+id+'.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}
// look-alike pieces: one absolutely placed frame per text line, and the page picture anchored behind the text
function wFrame(l,W,hide){
  const x=wClamp(l.x,0,W-12),w=Math.max(12,Math.min(Math.max(l.w*1.25,l.fs*3),W-x)),top=Math.max(0,l.y-l.fs*.95),h=wClamp(Math.round(l.fs*2),2,400);
  const sz='<w:sz w:val="'+h+'"/><w:szCs w:val="'+h+'"/>';
  let runs;
  if(hide){
    runs='<w:r><w:rPr>'+sz+'<w14:textFill><w14:solidFill><w14:srgbClr w14:val="000000"><w14:alpha w14:val="0"/></w14:srgbClr></w14:solidFill></w14:textFill></w:rPr><w:t xml:space="preserve">'+wEsc(l.text)+'</w:t></w:r>';
  }else{
    const base=(l.font?'<w:rFonts w:ascii="'+l.font+'" w:hAnsi="'+l.font+'" w:cs="'+l.font+'"/>':'');
    const tail='<w:color w:val="'+(l.color||'000000')+'"/>'+(l.sp?'<w:spacing w:val="'+l.sp+'"/>':'')+sz;
    runs=(l.runs||[{t:l.text}]).map(q=>'<w:r><w:rPr>'+base+(q.b?'<w:b/><w:bCs/>':'')+(q.i?'<w:i/><w:iCs/>':'')+tail+'</w:rPr><w:t xml:space="preserve">'+wEsc(q.t)+'</w:t></w:r>').join('');
  }
  return '<w:p><w:pPr><w:framePr w:w="'+wTw(w)+'" w:h="'+wTw(l.fs*1.35)+'" w:hRule="exact" w:wrap="around" w:vAnchor="page" w:hAnchor="page" w:x="'+wTw(x)+'" w:y="'+wTw(top)+'"/><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>'+runs+'</w:p>';
}
function wImgBack(rid,id,W,H,sect){
  const cx=Math.round(W*12700),cy=Math.round(H*12700);
  return '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/>'+(sect||'')+'</w:pPr><w:r><w:rPr><w:sz w:val="2"/></w:rPr><w:drawing><wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="'+id+'" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1"><wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionH><wp:positionV relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionV><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/><wp:docPr id="'+id+'" name="Page '+id+'"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="'+id+'" name="page'+id+'.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r></w:p>';
}
// parts: [{type:'hybrid',W,H,url,lines} | {type:'text',W,H,paras,m} | {type:'img',W,H,url} | {type:'blank',W,H}], one Word section (page size) each
function makeDocx(parts){
  const zip=new JSZip(),rels=[];let body='',img=0;
  parts.forEach((pt,i)=>{
    const last=i===parts.length-1;
    const m=pt.type==='text'?pt.m:(pt.type==='img'||pt.type==='hybrid')?{l:0,r:0,t:0,b:0}:{l:72,r:72,t:72,b:72};
    const sect=wSect(pt.W,pt.H,m);
    const tail=last?'':sect;
    if(pt.type==='hybrid'){
      img++;const rid='rId'+(img+1),name='image'+img+'.jpg';
      zip.file('word/media/'+name,wBytes(pt.url));
      rels.push('<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+name+'"/>');
      pt.lines.forEach(l=>{body+=wFrame(l,pt.W,pt.hide)});
      body+=wImgBack(rid,img,pt.W,pt.H,tail);
    }else if(pt.type==='img'){
      img++;const rid='rId'+(img+1),name='image'+img+'.jpg';
      zip.file('word/media/'+name,wBytes(pt.url));
      rels.push('<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+name+'"/>');
      body+=wImg(rid,img,pt.W*.985,pt.H*.985,tail);
    }else{
      const ps=pt.type==='text'&&pt.paras.length?pt.paras:[{text:'',half:22}];
      ps.forEach((p,k)=>{body+=wPara(p,k===ps.length-1?tail:'')});
    }
    if(last)body+=sect;
  });
  const W='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  zip.file('[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  zip.file('_rels/.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/_rels/document.xml.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+rels.join('')+'</Relationships>');
  zip.file('word/styles.xml',X+'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>');
  zip.file('word/document.xml',X+'<w:document '+W+'><w:body>'+body+'</w:body></w:document>');
  return zip;
}

// does this PDF page have a real text layer? (scanned pages do not)
async function pdfHasText(p){
  if(p.kind!=='pdf'||!p.src.pj)return false;
  if(p.hasText!==undefined)return p.hasText;
  try{
    const tc=await (await p.src.pj.getPage(p.idx+1)).getTextContent();
    let n=0;for(const it of tc.items)n+=(it.str||'').replace(/\s/g,'').length;
    p.hasText=n>=8;
  }catch(e){p.hasText=false}
  return p.hasText;
}
async function pageItems(p){
  const pg=await p.src.pj.getPage(p.idx+1);
  const rotation=(((pg.rotate||0)+p.rot)%360+360)%360;
  const vp=pg.getViewport({scale:1,rotation});
  const tc=await pg.getTextContent(),items=[],fm={};
  // bold/italic from the font itself (needs the page to have been drawn once, so the fonts are loaded)
  const fstyle=n=>{
    if(fm[n])return fm[n];
    const r={b:false,i:false};
    try{const f=pg.commonObjs.has(n)?pg.commonObjs.get(n):null;
      if(f){const nm=String(f.name||f.fallbackName||'');r.b=!!f.bold||/bold|black|heavy|demi/i.test(nm);r.i=!!f.italic||/italic|oblique/i.test(nm)}}catch(e){}
    return fm[n]=r;
  };
  for(const it of tc.items){
    if(typeof it.str!=='string'||!it.str.length)continue;
    const t=it.transform,fs=Math.hypot(t[0],t[1]);
    const [x,y]=vp.convertToViewportPoint(t[4],t[5]);
    const cx=(x+(it.width||0)/2)/vp.width,cy=(y-fs*.3)/vp.height;
    if((p.wo||[]).some(r=>cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h))continue; // text under a whiteout box is left out
    items.push({s:it.str,x,y,w:it.width||0,fs,ff:((tc.styles||{})[it.fontName]||{}).fontFamily||'',b:fstyle(it.fontName).b,i:fstyle(it.fontName).i});
  }
  return {W:vp.width,H:vp.height,items};
}
async function pageText(p){
  const {W,H,items}=await pageItems(p);
  return {W,H,...groupText(items,W,H)};
}
// text lines with exact positions (top-down, pt), for the look-alike mode; wide gaps start a new line box
function hLines(items,k){
  items=items.filter(i=>i.s.trim().length&&i.fs>0).map(i=>({s:i.s,x:i.x*k,y:i.y*k,w:i.w*k,fs:i.fs*k,ff:i.ff||'',b:!!i.b,i:!!i.i})).sort((a,b)=>a.y-b.y||a.x-b.x);
  const rows=[];
  for(const it of items){
    const r=rows[rows.length-1];
    if(r&&Math.abs(it.y-r.y)<Math.max(r.fs,it.fs)*.45){r.items.push(it);r.fs=Math.max(r.fs,it.fs)}
    else rows.push({y:it.y,fs:it.fs,items:[it]});
  }
  const out=[];
  for(const r of rows){
    r.items.sort((a,b)=>a.x-b.x);
    let seg=null,prev=null;
    for(const it of r.items){
      const gap=prev?it.x-(prev.x+prev.w):0;
      const add=(t,b,i)=>{const q=seg.runs[seg.runs.length-1];if(q&&q.b===b&&q.i===i)q.t+=t;else seg.runs.push({t,b,i});seg.text+=t};
      if(!seg||gap>r.fs*2.5){seg={text:'',runs:[],x:it.x,y:r.y,w:it.w,fs:r.fs,ff:it.ff};out.push(seg);add(it.s,it.b,it.i)}
      else{
        if(gap>r.fs*.12&&!/\s$/.test(seg.text)&&!/^\s/.test(it.s)){const q=seg.runs[seg.runs.length-1];add(' ',q.b,q.i)}
        add(it.s,it.b,it.i);seg.w=it.x+it.w-seg.x;
      }
      prev=it;
    }
  }
  return out.filter(l=>l.text.trim());
}
// look-alike page: the page picture (text taken out) behind, the real text on top in its own spot, color and font family
const hFamily=ff=>/mono/i.test(ff)?'Courier New':/serif/i.test(ff)&&!/sans/i.test(ff)?'Times New Roman':'Arial';
async function pageHybrid(p){
  const full=await pageJpeg(p),t=await pageItems(p),k=full.W/t.W,lines=hLines(t.items,k);
  let bare=null;
  try{bare=await pageJpeg(p,true)}catch(e){}
  const mc=document.createElement('canvas').getContext('2d');
  let hit=0;
  if(bare&&bare.cv&&full.cv){
    const sc=full.cv.width/full.W,fx=full.cv.getContext('2d'),bx=bare.cv.getContext('2d');
    for(const l of lines){
      const x0=Math.max(0,Math.floor(l.x*sc)),y0=Math.max(0,Math.floor((l.y-l.fs*.85)*sc));
      const w=Math.min(full.cv.width-x0,Math.ceil(l.w*sc)),h=Math.min(full.cv.height-y0,Math.ceil(l.fs*1.1*sc));
      if(w<1||h<1)continue;
      const A=fx.getImageData(x0,y0,w,h).data,B=bx.getImageData(x0,y0,w,h).data;
      let best=0,bi=-1;
      for(let i=0;i<A.length;i+=4){const d=Math.abs(A[i]-B[i])+Math.abs(A[i+1]-B[i+1])+Math.abs(A[i+2]-B[i+2]);if(d>best){best=d;bi=i}}
      if(best>90){hit++;l.color=[A[bi],A[bi+1],A[bi+2]].map(v=>v.toString(16).padStart(2,'0')).join('')}
    }
  }
  // text really removed from the picture: show real text. Otherwise keep the full picture and hide the text on top.
  const clean=lines.length&&hit/lines.length>=.6;
  for(const l of lines){
    l.font=hFamily(l.ff);
    let mw=0;
    for(const q of l.runs){mc.font=(q.i?'italic ':'')+(q.b?'bold ':'')+l.fs+'px "'+l.font+'"';mw+=mc.measureText(q.t).width}
    const n=[...l.text].length,sp=n>1?Math.round((l.w-mw)/(n-1)*20):0;
    l.sp=wClamp(sp,-60,60);
  }
  return {type:'hybrid',url:clean?bare.url:full.url,W:full.W,H:full.H,lines,hide:!clean};
}
// one page as a picture (rotation and whiteout boxes included)
async function pageJpeg(p,noText){
  let url,W,H,cv;
  if(p.kind==='pdf'){
    const pg=await p.src.pj.getPage(p.idx+1);
    const rotation=(((pg.rotate||0)+p.rot)%360+360)%360;
    const v=pg.getViewport({scale:1,rotation}),vp=pg.getViewport({scale:1400/v.width,rotation});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    if(noText){x.fillText=()=>{};x.strokeText=()=>{}} // pdf.js draws page text with these two calls
    await pg.render({canvasContext:x,viewport:vp}).promise;
    x.fillStyle='#fff';for(const r of p.wo||[])x.fillRect(r.x*c.width,r.y*c.height,r.w*c.width,r.h*c.height);
    url=c.toDataURL('image/jpeg',.9);cv=c;W=v.width;H=v.height;
    const k=Math.min(1,1500/Math.max(W,H));W*=k;H*=k;
  }else{
    url=await flatImg(p);
    const k=842/Math.max(p.w,p.h);W=p.w*k;H=p.h*k;
  }
  return {type:'img',url,W,H,cv};
}
async function convertWord(mode,idxList,progress){
  const parts=[];let n=0;
  for(const k of idxList){
    const p=pages[k];progress(++n,idxList.length);
    if(p.kind==='blank'){parts.push({type:'blank',W:595.28,H:841.89});continue}
    if(mode==='text'&&await pdfHasText(p)){parts.push({type:'text',...await pageText(p)});continue}
    if(mode==='hybrid'&&await pdfHasText(p)){parts.push(await pageHybrid(p));continue}
    if(p.kind==='pdf'&&!p.src.pj)throw new Error('Page '+(k+1)+' can’t be drawn in this browser.');
    parts.push(await pageJpeg(p));
    await new Promise(r=>setTimeout(r));
  }
  return makeDocx(parts);
}

const IMG='.jpg,.jpeg,.jfif,image/jpeg,image/pjpeg',ALL='.pdf,application/pdf,'+IMG;
function showView(){
  const v=location.hash.slice(1);
  const about=v==='about',conv=!about;
  $('aboutv').hidden=!about;layout();
  document.querySelectorAll('.opt').forEach(o=>o.hidden=conv);
  $('add').hidden=!conv;drop.classList.toggle('pick',conv);
  drop.onclick=conv?()=>file.click():null;
  $('b1').innerHTML=conv?'pdf':'less fuss.';
